<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="hamBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#hamBg)" stroke="#FCD34D" stroke-width="2.5"/>

  <!-- Hamster Ears -->
  <circle cx="34" cy="30" r="8" fill="#F97316"/>
  <circle cx="34" cy="30" r="5" fill="#FDA4AF"/>
  <circle cx="66" cy="30" r="8" fill="#F97316"/>
  <circle cx="66" cy="30" r="5" fill="#FDA4AF"/>

  <!-- Chubby Body -->
  <ellipse cx="50" cy="58" rx="26" ry="24" fill="url(#furGrad)"/>
  <!-- White Belly & Face Center -->
  <ellipse cx="50" cy="62" rx="18" ry="18" fill="#FFFDF8"/>
  <path d="M 43 38 C 43 38, 50 42, 57 38 C 57 48, 62 54, 62 62 C 62 72, 38 72, 38 62 C 38 54, 43 48, 43 38 Z" fill="#FFFDF8"/>

  <!-- Cute Eyes -->
  <circle cx="38" cy="46" r="3.8" fill="#1E293B"/>
  <circle cx="39.5" cy="44.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="62" cy="46" r="3.8" fill="#1E293B"/>
  <circle cx="63.5" cy="44.5" r="1.4" fill="#FFFFFF"/>

  <!-- Tiny Pink Nose & Mouth -->
  <polygon points="48,51 52,51 50,53" fill="#F43F5E"/>
  <path d="M 47 54 Q 50 56 53 54" fill="none" stroke="#7C2D12" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="32" cy="52" rx="4.5" ry="3" fill="#FDA4AF" opacity="0.8"/>
  <ellipse cx="68" cy="52" rx="4.5" ry="3" fill="#FDA4AF" opacity="0.8"/>

  <!-- Paws holding together -->
  <ellipse cx="44" cy="64" rx="4" ry="3.5" fill="#FED7AA"/>
  <ellipse cx="56" cy="64" rx="4" ry="3.5" fill="#FED7AA"/>

  <!-- Seed / Sprout in paws -->
  <path d="M 47 62 C 47 58, 53 58, 53 62 C 53 66, 47 66, 47 62 Z" fill="#78350F"/>
</svg>