<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="pgBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#pgBg)" stroke="#5EEAD4" stroke-width="2.5"/>

  <!-- Auburn Hair Back -->
  <path d="M 30 45 C 24 55, 24 72, 34 78 Q 50 82 66 78 C 76 72, 76 55, 70 45 Z" fill="#991B1B"/>

  <!-- Body -->
  <path d="M 32 86 Q 32 68 40 68 L 60 68 Q 68 68 68 86 Z" fill="#3B82F6"/>

  <!-- Face -->
  <ellipse cx="50" cy="46" rx="18" ry="16" fill="#FFEDD5"/>

  <!-- Bangs -->
  <path d="M 34 40 Q 42 46 50 41 Q 58 46 66 40 Q 62 32 50 32 Q 38 32 34 40 Z" fill="#B91C1C"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="46" rx="3" ry="3.8" fill="#1E293B"/>
  <circle cx="44" cy="44.5" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="57" cy="46" rx="3" ry="3.8" fill="#1E293B"/>
  <circle cx="58" cy="44.5" r="1.2" fill="#FFFFFF"/>

  <!-- Blush -->
  <ellipse cx="37" cy="50" rx="4" ry="2.2" fill="#F43F5E" opacity="0.6"/>
  <ellipse cx="63" cy="50" rx="4" ry="2.2" fill="#F43F5E" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 47 52 Q 50 55 53 52" fill="none" stroke="#7F1D1D" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Terracotta Pot Plant in Hands -->
  <g transform="translate(50, 72)">
    <!-- Pot -->
    <path d="M -9 4 L 9 4 L 7 14 L -7 14 Z" fill="#EA580C" stroke="#C2410C" stroke-width="1.2"/>
    <rect x="-10" y="2" width="20" height="3" rx="1.5" fill="#C2410C"/>
    <!-- Plant Leaves -->
    <path d="M 0 2 Q -6 -6 -8 -2 Q -4 4 0 2 Z" fill="#22C55E"/>
    <path d="M 0 2 Q 6 -6 8 -2 Q 4 4 0 2 Z" fill="#4ADE80"/>
    <path d="M 0 2 Q 0 -8 0 -8 Q 4 -4 0 2 Z" fill="#16A34A"/>
    <!-- Hands holding pot -->
    <circle cx="-9" cy="8" r="3" fill="#FFEDD5"/>
    <circle cx="9" cy="8" r="3" fill="#FFEDD5"/>
  </g>
</svg>