<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="otherGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
  </defs>

  <!-- Floating Question Mark on Upper Right -->
  <g transform="translate(68, 12) rotate(12) scale(0.85)">
    <text x="0" y="20" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', sans-serif" font-size="22" font-weight="900" fill="#EC4899">?</text>
    <circle cx="16" cy="4" r="1.5" fill="#F472B6"/>
  </g>

  <!-- Face Body -->
  <circle cx="50" cy="52" r="39" fill="url(#otherGrad)" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- Cheeks Blush -->
  <ellipse cx="27" cy="58" rx="7" ry="4" fill="#F472B6" opacity="0.45"/>
  <ellipse cx="73" cy="58" rx="7" ry="4" fill="#F472B6" opacity="0.45"/>

  <!-- Curious Tilted Dot Eyes -->
  <circle cx="39" cy="48" r="4.2" fill="#543A3A"/>
  <circle cx="40.5" cy="46.5" r="1.5" fill="#FFFFFF"/>

  <circle cx="61" cy="48" r="4.2" fill="#543A3A"/>
  <circle cx="62.5" cy="46.5" r="1.5" fill="#FFFFFF"/>

  <!-- Surprised Cute 'o' Mouth -->
