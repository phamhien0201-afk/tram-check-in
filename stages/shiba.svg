  <path d="M 38 45 Q 43 40 46 45" fill="none" stroke="#451A03" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 54 45 Q 57 40 62 45" fill="none" stroke="#451A03" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Black Nose -->
