<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="shibaBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#shibaBg)" stroke="#FACC15" stroke-width="2.5"/>

  <!-- Shiba Ears -->
  <polygon points="32,38 24,18 42,26" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
  <polygon points="32,36 27,22 39,28" fill="#FFFFFF"/>

  <polygon points="68,38 76,18 58,26" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
  <polygon points="68,36 73,22 61,28" fill="#FFFFFF"/>

  <!-- Shiba Head -->
  <circle cx="50" cy="48" r="23" fill="#F59E0B"/>

  <!-- White Muzzle & Cheeks -->
  <path d="M 33 46 Q 30 62 50 64 Q 70 62 67 46 Q 50 48 33 46 Z" fill="#FFFFFF"/>
  <circle cx="38" cy="38" r="2.5" fill="#FFFFFF"/>
  <circle cx="62" cy="38" r="2.5" fill="#FFFFFF"/>

