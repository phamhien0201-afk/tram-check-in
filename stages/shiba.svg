  <ellipse cx="68" cy="53" rx="4.5" ry="2.5" fill="#FDA4AF" opacity="0.8"/>

  <!-- Red Collar with Gold Bell -->
  <path d="M 36 68 Q 50 74 64 68 L 63 73 Q 50 79 37 73 Z" fill="#E11D48"/>
  <circle cx="50" cy="76" r="3.2" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
