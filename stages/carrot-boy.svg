<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="cbBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#cbBg)" stroke="#6EE7B7" stroke-width="2.5"/>

  <!-- Body in Green Overalls -->
  <path d="M 32 86 Q 32 68 40 68 L 60 68 Q 68 68 68 86 Z" fill="#10B981"/>

  <!-- Neck -->
  <rect x="45" y="58" width="10" height="8" fill="#FFEDD5" rx="3"/>

  <!-- Face -->
  <ellipse cx="50" cy="46" rx="18" ry="16" fill="#FFEDD5"/>

  <!-- Hair & Straw Hat -->
  <path d="M 36 28 C 36 15, 64 15, 64 28 Z" fill="#FDE047"/>
  <ellipse cx="50" cy="28" rx="26" ry="7" fill="#FDE047" stroke="#D97706" stroke-width="1.8"/>
  <path d="M 35 38 Q 43 45 50 39 Q 57 45 65 38 Z" fill="#92400E"/>

  <!-- Eyes -->
  <circle cx="43" cy="46" r="3.2" fill="#1E293B"/>
  <circle cx="44" cy="44.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="57" cy="46" r="3.2" fill="#1E293B"/>
  <circle cx="58" cy="44.5" r="1.2" fill="#FFFFFF"/>

  <!-- Blush & Smile -->
  <ellipse cx="37" cy="50" rx="4" ry="2.2" fill="#F43F5E" opacity="0.6"/>
  <ellipse cx="63" cy="50" rx="4" ry="2.2" fill="#F43F5E" opacity="0.6"/>
  <path d="M 47 52 Q 50 56 53 52" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Giant Carrot -->
  <g transform="translate(64, 52) rotate(22)">
    <!-- Carrot Greens -->
    <path d="M 0 -8 Q -4 -16 0 -18 Q 4 -16 0 -8 Z" fill="#22C55E"/>
    <path d="M 0 -8 Q -8 -14 -4 -16 Q 0 -10 0 -8 Z" fill="#16A34A"/>
    <path d="M 0 -8 Q 8 -14 4 -16 Q 0 -10 0 -8 Z" fill="#4ADE80"/>
    <!-- Carrot Root -->
    <path d="M -5 -8 L 5 -8 L 0 24 Z" fill="#F97316" stroke="#EA580C" stroke-width="1.2"/>
    <line x1="-3" y1="-2" x2="1" y2="-2" stroke="#EA580C" stroke-width="1.2"/>
    <line x1="0" y1="6" x2="3" y2="6" stroke="#EA580C" stroke-width="1.2"/>
    <line x1="-2" y1="14" x2="1" y2="14" stroke="#EA580C" stroke-width="1.2"/>
  </g>
</svg>