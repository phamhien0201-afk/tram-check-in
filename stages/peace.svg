<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="peaceGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDEC"/>
      <stop offset="70%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </radialGradient>
  </defs>

  <!-- Sprout on Head -->
  <g transform="translate(50, 16) scale(0.85)">
    <!-- Stem -->
    <path d="M 0 6 Q -1 -2 0 -8" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M 0 -8 C -6 -12, -14 -8, -12 -2 C -10 2, -2 -2, 0 -8 Z" fill="#4ADE80" stroke="#16A34A" stroke-width="1.2"/>
    <!-- Right Leaf -->
    <path d="M 0 -8 C 6 -14, 14 -10, 12 -4 C 10 2, 2 -2, 0 -8 Z" fill="#86EFAC" stroke="#16A34A" stroke-width="1.2"/>
  </g>

  <!-- Face Body -->
  <circle cx="50" cy="54" r="38" fill="url(#peaceGrad)" stroke="#EAB308" stroke-width="2.5"/>

  <!-- Cheeks Blush -->
  <ellipse cx="26" cy="57" rx="7.5" ry="4" fill="#F97316" opacity="0.45"/>
  <ellipse cx="74" cy="57" rx="7.5" ry="4" fill="#F97316" opacity="0.45"/>

  <!-- Peaceful Eyes (Happy Slits) -->
  <path d="M 32 47 Q 40 54 48 48" fill="none" stroke="#543A3A" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 52 48 Q 60 54 68 47" fill="none" stroke="#543A3A" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Peaceful Smile -->
  <path d="M 44 58 Q 50 63 56 58" fill="none" stroke="#543A3A" stroke-width="2.8" stroke-linecap="round"/>
</svg>