<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="fgBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </radialGradient>
    <linearGradient id="hatGradG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#fgBg)" stroke="#F472B6" stroke-width="2.5"/>

  <!-- Twin Pigtails -->
  <path d="M 28 50 C 22 55, 20 68, 27 75 C 32 72, 34 62, 32 54 Z" fill="#78350F"/>
  <path d="M 72 50 C 78 55, 80 68, 73 75 C 68 72, 66 62, 68 54 Z" fill="#78350F"/>
  <circle cx="28" cy="58" r="3" fill="#EC4899"/>
  <circle cx="72" cy="58" r="3" fill="#EC4899"/>

  <!-- Body / Red Overalls -->
  <path d="M 28 86 Q 28 68 38 68 L 62 68 Q 72 68 72 86 Z" fill="#F43F5E"/>
  <!-- White Inner Shirt -->
  <path d="M 38 68 Q 50 74 62 68 L 58 64 Q 50 67 42 64 Z" fill="#FFFFFF"/>
  <!-- Overalls Straps -->
  <rect x="36" y="68" width="6" height="18" fill="#BE123C" rx="2"/>
  <rect x="58" y="68" width="6" height="18" fill="#BE123C" rx="2"/>
  <circle cx="39" cy="74" r="1.5" fill="#FDE047"/>
  <circle cx="61" cy="74" r="1.5" fill="#FDE047"/>

  <!-- Neck -->
  <rect x="45" y="58" width="10" height="8" fill="#FFEDD5" rx="3"/>

  <!-- Face -->
  <ellipse cx="50" cy="48" rx="19" ry="17" fill="#FFEDD5"/>

  <!-- Brown Hair Bangs -->
  <path d="M 32 44 Q 38 48 44 42 Q 50 47 56 42 Q 62 48 68 44 Q 65 34 50 34 Q 35 34 32 44 Z" fill="#78350F"/>

  <!-- Eyes (Anime Chibi Sparkle) -->
  <ellipse cx="42" cy="48" rx="3.2" ry="4" fill="#312E81"/>
  <circle cx="43" cy="46.5" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="58" cy="48" rx="3.2" ry="4" fill="#312E81"/>
  <circle cx="59" cy="46.5" r="1.2" fill="#FFFFFF"/>

  <!-- Blush -->
  <ellipse cx="36" cy="52" rx="4.5" ry="2.5" fill="#FB7185" opacity="0.65"/>
  <ellipse cx="64" cy="52" rx="4.5" ry="2.5" fill="#FB7185" opacity="0.65"/>

  <!-- Sweet Smile -->
  <path d="M 47 54 Q 50 57 53 54" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Straw Hat Crown -->
  <path d="M 36 28 C 36 14, 64 14, 64 28 Z" fill="url(#hatGradG)"/>
  <!-- Straw Hat Brim -->
  <ellipse cx="50" cy="28" rx="27" ry="7.5" fill="url(#hatGradG)" stroke="#B45309" stroke-width="1.8"/>
  <path d="M 36 27 Q 50 30 64 27" fill="none" stroke="#EC4899" stroke-width="2"/>
</svg>